name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Quality gate 1: TypeScript ────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      # ── Quality gate 2: Lint ──────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Quality gate 3: Build ─────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── Quality gate 4: Tests + Coverage ─────────────────────────────────
      - name: Test with coverage
        run: npm run test:coverage

      # Upload coverage report as artifact for inspection (Node 20 only)
      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Post coverage summary to PR (Node 20 run only to avoid duplicate posts)
      - name: Coverage summary comment
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
